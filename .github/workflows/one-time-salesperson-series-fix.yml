name: One-time salesperson and invoice series fix

on:
  push:
    branches:
      - feature/dotnet-mssql-server

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/dotnet-mssql-server
          fetch-depth: 0

      - name: Apply patch
        run: python tools/apply-salesperson-series-fix.py

      - name: Verify frontend and API builds
        run: |
          npm install
          npm run build
          dotnet build server-dotnet/AVASurface.Server.csproj

      - name: Commit patch and remove temporary files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/PosBillingView.tsx server.ts server-dotnet/Controllers/InvoicesController.cs
          git rm .github/workflows/one-time-salesperson-series-fix.yml tools/apply-salesperson-series-fix.py
          git commit -m "feat: require salesperson and generate invoice series on save"
          git push origin HEAD:feature/dotnet-mssql-server
