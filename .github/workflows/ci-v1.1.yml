name: AVASurface v1.1 CI

on:
  push:
    branches:
      - feature/v1.1.0-enterprise-management
  pull_request:
    branches:
      - feature/v1.1.0-enterprise-management
      - release/v1.0.0-frozen

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Install frontend dependencies
        run: npm ci
      - name: TypeScript checks
        run: npm run lint
      - name: Frontend production build
        run: npm run build
      - name: Restore .NET projects
        run: |
          dotnet restore server-dotnet/AVASurface.Server.csproj
          dotnet restore server-dotnet.Tests/AVASurface.Server.Tests.csproj
      - name: Backend build
        run: dotnet build server-dotnet/AVASurface.Server.csproj --configuration Release --no-restore
      - name: Enterprise pricing tests
        run: dotnet test server-dotnet.Tests/AVASurface.Server.Tests.csproj --configuration Release --no-restore
