name: Apply promo selection fix

on:
  push:
    branches:
      - feature/dotnet-mssql-server

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/dotnet-mssql-server
          fetch-depth: 0
      - name: Apply promo patch
        run: python tools/fix-promo-selection.py
      - name: Validate builds
        run: |
          npm install
          npm run build
          dotnet build server-dotnet/AVASurface.Server.csproj
      - name: Commit patch and remove temporary files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/PosBillingView.tsx
          git rm .github/workflows/apply-promo-selection-fix.yml tools/fix-promo-selection.py
          git commit -m "fix billing: allow promo selection and removal"
          git push origin HEAD:feature/dotnet-mssql-server
