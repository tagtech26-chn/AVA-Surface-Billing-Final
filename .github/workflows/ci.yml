name: CI

on:
  push:
    branches: [main, 'feature/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore .NET solution projects
        run: |
          dotnet restore server-dotnet/AVASurface.Server.csproj
          dotnet restore server-dotnet.Tests/AVASurface.Server.Tests.csproj

      - name: Build .NET backend
        run: dotnet build server-dotnet/AVASurface.Server.csproj --configuration Release --no-restore

      - name: Run backend unit tests
        run: dotnet test server-dotnet.Tests/AVASurface.Server.Tests.csproj --configuration Release --no-restore --verbosity normal

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: TypeScript validation
        run: npm run lint

      - name: Frontend production build
        run: npm run build
