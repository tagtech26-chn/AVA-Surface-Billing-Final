name: Apply B2B manual customer fallback

on:
  push:
    branches:
      - feature/dotnet-mssql-server

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/dotnet-mssql-server
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install frontend dependencies
        run: npm ci
      - name: Apply patch
        run: python tools/apply-b2b-manual-fallback.py
      - name: Verify frontend
        run: npm run build
      - name: Verify backend
        run: dotnet build server-dotnet/AVASurface.Server.csproj
      - name: Commit patch and remove helpers
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/PosBillingView.tsx
          git rm tools/apply-b2b-manual-fallback.py .github/workflows/patch-b2b-manual-fallback.yml
          git commit -m "fix: allow manual B2B customer details after GST failure"
          git push origin HEAD:feature/dotnet-mssql-server
